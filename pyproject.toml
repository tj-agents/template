[project]
name = "template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
include = [".agents/**/*.py", ".github/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = [".agents", ".github/scripts"]
mypy_path = [
    ".agents",
    ".agents/template/utility/check/scripts",
    ".github/scripts",
    ".codex/hooks",
]

[tool.pytest]
strict = true
testpaths = [".agents/tests"]
pythonpath = [
    ".agents",
    ".agents/template/utility/check/scripts",
    ".github/scripts",
    ".codex/hooks",
]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
