[project]
name = "template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-template"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tj-template"]

[tool.uv.sources]
tj-template = { workspace = true }

[tool.ruff]
include = [".agents/**/*.py", ".github/**/*.py", "packages/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = [".agents", ".github/scripts", "packages/tj-template"]

[tool.pytest]
strict = true
testpaths = [".agents/tests", "packages/tj-template/tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
