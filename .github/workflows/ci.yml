name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    uses: ./.github/workflows/plugin-ci.yml
    with:
      template_ref: ${{ github.sha }}
      template_repository: ${{ github.repository }}
      generate_before_verify: true
    secrets:
      read_token: ${{ secrets.TJ_AGENTS_READ_TOKEN }}

  system-python-resources:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - name: resolve distribution resources with Ubuntu's system Python
        run: >-
          uv run --no-project --python /usr/bin/python3 --with pytest
          --with ./packages/tj-template pytest .agents/tests/test_generation.py -k real_locked -q

  regenerate:
    if: github.event_name == 'push'
    needs: verify
    runs-on: windows-latest
    environment: regenerate
    permissions:
      contents: write
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.REGENERATE_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0

      - name: regenerate committed packages from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --locked --no-editable tj-template generate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify the regenerated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --locked --no-editable tj-template check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: commit and push the regeneration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $remoteMain = git ls-remote --exit-code origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteMain = ($remoteMain -split "\s+")[0]
          if ($remoteMain -ne $env:GITHUB_SHA) {
            "Main advanced since this workflow started; skipping regeneration publication."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .codex/skills .claude/skills .agents/INDEX.md .agents/plugins/marketplace.json .claude-plugin/marketplace.json plugins
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "Regenerate packages for $env:GITHUB_SHA"
            $nativeErrorActionPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            git push origin HEAD:main
            $pushExitCode = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $nativeErrorActionPreference
            if ($pushExitCode -ne 0) {
              $remoteMain = git ls-remote --exit-code origin refs/heads/main
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $remoteMain = ($remoteMain -split "\s+")[0]
              if ($remoteMain -ne $env:GITHUB_SHA) {
                "Main advanced while regeneration was publishing; skipping superseded publication."
                exit 0
              }
              exit $pushExitCode
            }
          } else {
            "Generated output already current."
          }
