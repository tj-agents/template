name: plugin-ci

on:
  workflow_call:
    inputs:
      template_ref:
        description: Template source ref; defaults to main and may be overridden for candidate checks.
        required: false
        default: main
        type: string
      template_repository:
        description: The Template repository to check out.
        required: false
        default: tj-agents/template
        type: string
      generate_before_verify:
        required: false
        default: false
        type: boolean
    secrets:
      read_token:
        description: A token that can read the organization's Template and core repositories.
        required: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: .template
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/core
          path: .core
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/react
          path: .react
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/dotnet
          path: .dotnet
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
      - name: resolve the authored-guidance comparison range
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
            $mergeBase = '--merge-base'
          } else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
            $mergeBase = ''
          }
          "GUIDANCE_EXAMPLES_BASE=$base" >> $env:GITHUB_ENV
          "GUIDANCE_EXAMPLES_HEAD=$head" >> $env:GITHUB_ENV
          "GUIDANCE_EXAMPLES_MERGE_BASE=$mergeBase" >> $env:GITHUB_ENV
      - name: regenerate generated files from authored sources
        if: inputs.generate_before_verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: generated files are current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: repository tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path pyproject.toml) {
            uv sync --locked
            uv run ruff format --check
            uv run ruff check
            uv run mypy
            if (Test-Path .agents/tests/test_*.py) { uv run pytest }
            exit $LASTEXITCODE
          }
          if (Test-Path .agents/tests/test_*.py) {
            python -B -m unittest discover -s .agents/tests -p "test_*.py"
            exit $LASTEXITCODE
          }
      - name: the repository conforms to the current Template source
        shell: pwsh
        run: |
          $checkArguments = @('--root', '.', '--base', $env:GUIDANCE_EXAMPLES_BASE, '--head', $env:GUIDANCE_EXAMPLES_HEAD)
          if ($env:GUIDANCE_EXAMPLES_MERGE_BASE) {
            $checkArguments += $env:GUIDANCE_EXAMPLES_MERGE_BASE
          }
          python -B .template/.agents/template/utility/check/scripts/check.py @checkArguments
      - name: authored skill references resolve in the public corpus
        shell: pwsh
        run: python -B .template/.agents/template/utility/check/scripts/check_skill_references.py --root . --root .template --root .core --root .react --root .dotnet --source-root .
      - name: tier payloads conform to the shipped shape
        shell: pwsh
        run: python -B .core/plugins/base/hooks/check_tier_payload.py --root .

  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: .template
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: regenerate generated files from authored sources
        if: inputs.generate_before_verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: generated files are current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the pinned host CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.282 @openai/codex@0.159.2
      - name: Claude Code and Codex accept the marketplace and plugins
        run: python -B .template/.github/scripts/validate_hosts.py --root .
