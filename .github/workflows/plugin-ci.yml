name: plugin-ci

on:
  workflow_call:
    inputs:
      cli_ref:
        description: CLI source ref used to build tj_hook for hook execution tests.
        required: false
        default: cd8c726e2aadc321251de599b75c4e72e21cecb9
        type: string
      template_ref:
        description: Template source ref; defaults to main and may be overridden for candidate checks.
        required: false
        default: main
        type: string
      template_repository:
        description: The Template repository to check out.
        required: false
        default: tj-agents/template
        type: string
      generate_before_verify:
        required: false
        default: false
        type: boolean
    secrets:
      read_token:
        description: A token that can read the organization's Template and core repositories.
        required: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: .template
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tj-agents/cli
          ref: ${{ inputs.cli_ref }}
          path: .tj-cli
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: build the pinned tj_hook candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location .tj-cli
          cargo build --locked --release --bin tj_hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $binaryDirectory = (Resolve-Path .tj-cli/target/release).Path
          $binaryName = if ($IsWindows) { 'tj_hook.exe' } else { 'tj_hook' }
          if (-not (Test-Path (Join-Path $binaryDirectory $binaryName))) {
            throw "Missing built $binaryName"
          }
          $binaryDirectory >> $env:GITHUB_PATH
      - name: resolve the authored-guidance comparison range
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
            $mergeBase = '--merge-base'
          } else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
            $mergeBase = ''
          }
          "GUIDANCE_EXAMPLES_BASE=$base" >> $env:GITHUB_ENV
          "GUIDANCE_EXAMPLES_HEAD=$head" >> $env:GITHUB_ENV
          "GUIDANCE_EXAMPLES_MERGE_BASE=$mergeBase" >> $env:GITHUB_ENV
      - name: regenerate generated files from authored sources
        if: inputs.generate_before_verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: generated files are current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: repository tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path pyproject.toml) {
            uv sync --locked
            uv run ruff format --check
            uv run ruff check
            uv run mypy
            if (Test-Path .agents/tests/test_*.py) { uv run pytest }
            exit $LASTEXITCODE
          }
          if (Test-Path .agents/tests/test_*.py) {
            python -B -m unittest discover -s .agents/tests -p "test_*.py"
            exit $LASTEXITCODE
          }
      - name: the repository conforms to the current Template source
        shell: pwsh
        run: |
          $checkArguments = @('--root', '.', '--base', $env:GUIDANCE_EXAMPLES_BASE, '--head', $env:GUIDANCE_EXAMPLES_HEAD)
          if ($env:GUIDANCE_EXAMPLES_MERGE_BASE) {
            $checkArguments += $env:GUIDANCE_EXAMPLES_MERGE_BASE
          }
          python -B .template/.agents/template/utility/check/scripts/check.py @checkArguments
      - name: authored skill references resolve in the public corpus
        shell: pwsh
        env:
          SKILL_REFERENCES_TOKEN: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
        run: python -B .template/.agents/template/utility/check/scripts/check_skill_references.py --root . --source-root . --marketplace tj-agents/marketplace

  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: .template
          token: ${{ secrets.read_token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: regenerate generated files from authored sources
        if: inputs.generate_before_verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: generated files are current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the pinned host CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.282 @openai/codex@0.159.2
      - name: Claude Code and Codex accept the marketplace and plugins
        run: python -B .template/.github/scripts/validate_hosts.py --root .
