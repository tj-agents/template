name: Workflow Pin Guard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-pins:
    name: Check reusable workflow pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.repository != 'tj-agents/template'
        with:
          repository: tj-agents/template
          ref: main
          path: .template
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Require producer default-branch ancestry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_ROOT: ${{ github.repository == 'tj-agents/template' && '.' || '.template' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --project $env:CHECKER_ROOT --locked python -B "$env:CHECKER_ROOT/.agents/template/utility/check/scripts/check_workflow_pins.py" --root .
